[project]
name = "dial"
version = "0.1.0"
description = "Finds what is quietly costing you money, then makes the call you have been avoiding."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.0.0",
    "pydantic>=2.7",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
# aws-sdk-bedrock-runtime is pinned exactly. strands-agents 1.53.0 declares >=0.4.0,<1.0.0
# but imports BedrockRuntimeClient, which 0.10.0 dropped and 0.11.0 renamed to
# AsyncBedrockRuntimeClient. Both current releases therefore fail at import. 0.9.0 is the
# newest that works. Verified 2026-08-24; recheck when bumping strands.
voice = [
    "strands-agents[bidi]>=1.53.0",
    "aws-sdk-bedrock-runtime==0.9.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
